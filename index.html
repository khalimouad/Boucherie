<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f7fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Point de vente pour boucherie — caisse tactile, mobile et hors-ligne." />
    <title>Boucherie POS — نقطة بيع الجزارة</title>
    <script>
      /* Stamp the theme before first paint so the app never flashes the wrong
         colour scheme on a cold start. Mirrors src/theme.ts. */
      (function () {
        try {
          var m = localStorage.getItem('pos-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0d1117' : '#f5f7fa');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

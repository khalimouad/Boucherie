<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f7fa" />
    <!-- Inline SVG : aucune requete reseau, et sert d'icone de fenetre quand la
         caisse est lancee en mode application (--app) depuis BoucheriePOS.exe -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23d43423'/%3E%3Cpath fill='%23fff' transform='translate(8 8) scale(2)' d='M17.7 4.3c-2.6-2.6-7-2.4-9.6.2L4.6 8c-2 2-2.06 5.2-.16 7.26.86.93 2 1.46 3.18 1.6.14 1.16.68 2.28 1.6 3.14C11.3 21.9 14.5 21.84 16.5 19.84l3.5-3.5c2.6-2.6 2.4-7.03-.3-9.64l-2-2Zm-8.7 12a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z'/%3E%3C/svg%3E"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Point de vente pour boucherie — caisse tactile, mobile et hors-ligne." />
    <title>Boucherie POS — نقطة بيع الجزارة</title>
    <script>
      /* Stamp the theme before first paint so the app never flashes the wrong
         colour scheme on a cold start. Mirrors src/theme.ts. */
      (function () {
        try {
          var m = localStorage.getItem('pos-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0d1117' : '#f5f7fa');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
